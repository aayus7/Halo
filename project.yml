name: Halo
options:
  bundleIdPrefix: com.aa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Halo:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - HaloTests
    sources:
      - path: Halo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aa.halo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
    info:
      path: Halo/Info.plist
      properties:
        CFBundleDisplayName: Halo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: com.aa.halo
            CFBundleURLSchemes: [halo]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  HaloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HaloTests
    dependencies:
      - target: Halo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aa.halo.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Halo.app/Halo
        BUNDLE_LOADER: $(TEST_HOST)
